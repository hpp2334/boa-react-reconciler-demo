[workspace]
resolver = "2"
members = [
    "crates/boa-native-core",
    "crates/boa-native-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/boa-react-reconciler-demo"

[workspace.dependencies]
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "2c1eb630fd698d71b164194be4fef95ce9477fec", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
